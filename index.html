<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarea10</title>
    <style>
        #container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 150px); 
        gap: 15px;
        padding: 15px;
        border: 1px solid #ccc;
        grid-template-areas: 
            "uno dos dos tres"
            "uno cinco siete cuatro"
            "uno ocho seis cuatro";
        }
        .uno { 
            grid-area: uno; 
            background-color: green; 
        }
        .dos { 
            grid-area: dos; 
            background-color: green; 
        }
        .tres { 
            grid-area: tres; 
            background-color: red; 
        }
        .cuatro { 
            grid-area: cuatro; 
            background-color: green; 
        }
        .cinco { 
            grid-area: cinco; 
            background-color: orange; 
        }
        .seis { 
            grid-area: seis; 
            background-color: orange; 
        }
        .siete { 
            grid-area: siete; 
            background-color: red; 
        }
        .ocho { 
            grid-area: ocho; 
            background-color: red; 
        }
        .caja {
            width: 100%;
            height: 100%;
            border: 1px solid black;
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
